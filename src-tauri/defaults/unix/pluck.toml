# Pluck reads this file each time the menu opens. Each [[action]] is one menu entry:
#
#   id      stable name for the action
#   name    what the menu shows
#   key     optional letter that runs it straight from the menu
#   run     command line, run in this folder by sh. It gets the selected text on stdin and in
#           PLUCK_TEXT, plus PLUCK_APP and PLUCK_TITLE.
#   output  "show" streams stdout into a panel, "copy" puts it on the clipboard,
#           "replace" previews it and puts it in place of the selection on Enter,
#           "notify" (the default) runs in the background and shows its first line.
#   agent   instead of run: a prompt. The text is sent with it to an agent session, using the
#           agent set in Settings.

[[action]]
id = "explain"
name = "Explain"
key = "e"
agent = "Explain this briefly."

[[action]]
id = "translate"
name = "Translate to English"
key = "t"
run = 'bash scripts/translate.sh'

[[action]]
id = "search"
name = "Search the web"
key = "s"
run = 'bash scripts/search.sh'

[[action]]
id = "bookmark"
name = "Save as bookmark"
key = "b"
run = 'bash scripts/bookmark.sh'

[[action]]
id = "count"
name = "Count words"
key = "w"
run = 'bash scripts/count.sh'
output = "show"

[[action]]
id = "upper"
name = "Uppercase"
key = "u"
run = 'bash scripts/upper.sh'
output = "replace"
