# Pluck reads this file each time the menu opens. Each [[action]] is one menu entry:
#
#   id      stable name for the action
#   name    what the menu shows
#   key     optional letter that runs it straight from the menu
#   run     command line, run in this folder by cmd.exe, or by bash when Settings has Run in WSL.
#           It gets the selected text on stdin and in PLUCK_TEXT (unless it's very long), plus
#           PLUCK_APP, PLUCK_TITLE and, for text copied from a browser, PLUCK_URL.
#   env     optional variables for the script, e.g. env = { VOICE = "af_heart", SPEED = "1.1" }
#   quiet   true shows no card while it runs, only its result, for actions you start several of
#   output  "show" streams stdout into a panel, "copy" puts it on the clipboard,
#           "replace" previews it and puts it in place of the selection on Enter,
#           "notify" (the default for scripts) runs in the background and shows its last line.
#   agent   instead of run: a prompt. The text is sent with it to an agent session, using the
#           agent set in Settings.
#           With agent, output is for the agent's reply, and "session" (the default) opens a
#           session instead; "notify" shows the whole reply.
#   model, thinking  for agent actions, the model ("provider/id") and thinking level to use
#           instead of the ones in Settings.

[[action]]
id = "explain"
name = "Explain"
key = "e"
agent = "Explain this briefly."

[[action]]
id = "translate"
name = "Translate to English"
key = "t"
run = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/translate.ps1'

[[action]]
id = "search"
name = "Search the web"
key = "s"
run = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/search.ps1'

[[action]]
id = "bookmark"
name = "Save as bookmark"
key = "b"
run = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/bookmark.ps1'

[[action]]
id = "count"
name = "Count words"
key = "w"
run = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/count.ps1'
output = "show"

[[action]]
id = "upper"
name = "Uppercase"
key = "u"
run = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/upper.ps1'
output = "replace"

[[action]]
id = "read"
name = "Read aloud"
key = "r"
# Needs uv (https://docs.astral.sh/uv). The first run downloads a 300 MB voice model.
# Stop it from its card at the bottom of the screen. ENGINE = "edge" uses Microsoft's online voices instead.
run = 'uv run --script scripts/read.py'
env = { VOICE = "af_heart", SPEED = "1.0" }
