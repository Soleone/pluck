[package]
name = "pluck"
version = "0.1.0"
description = "Send selected text from any app to your scripts"
authors = ["Soleone"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "pluck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
arboard = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"
toml = "1.2.0"
toml_edit = "0.25.18"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.3"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
  "NSWorkspace",
  "NSRunningApplication",
  "NSPasteboard",
] }
objc2-core-graphics = { version = "0.3.2", features = [
  "CGEvent",
  "CGEventTypes",
  "CGEventSource",
  "CGRemoteOperation",
] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
